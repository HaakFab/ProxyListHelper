{% extends "base.html" %}
{% block title %}Konto{% endblock %}
{% block content %}
<div class="card">
  <h1>Konto</h1>
  <p><strong>{{ user.display_name }}</strong> ({{ user.person_slug }})</p>

  <form method="post" action="/account">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">E-Mail (optional, nur für Benachrichtigungen)</label>
    <input type="email" id="email" name="email" value="{{ user.email or '' }}">
    <label style="display:flex;align-items:center;gap:0.5rem;font-weight:normal;">
      <input type="checkbox" name="notify" value="true" style="width:auto;" {% if user.notify %}checked{% endif %}>
      Über Statusänderungen benachrichtigen
    </label>
    <p style="margin-top:1rem;"><button type="submit">Speichern</button></p>
  </form>
</div>

<div class="card">
  <h2>Sitzungen</h2>
  <form method="post" action="/account/logout-everywhere">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="secondary">Überall abmelden</button>
  </form>
</div>

<div class="card">
  <h2>Deine Daten</h2>
  <p><a class="button secondary" href="/account/export">Meine Daten herunterladen (JSON)</a></p>
  <p><a class="button danger" href="/account/delete">Konto &amp; Daten löschen</a></p>
</div>
{% endblock %}
