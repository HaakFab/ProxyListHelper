services:
  - type: web
    name: proxy-list-helper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PRICE_PER_CARD_CENTS
        value: "13"
      - key: PRICE_PER_LIST_CENTS
        value: "26"
      - key: ORDER_FEE_CENTS
        value: "0"
